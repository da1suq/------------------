version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: codedojo_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: codedojo_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata_hack:/var/lib/postgresql/data

volumes:
  pgdata_hack: